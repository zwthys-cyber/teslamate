name: TeslaMateMobile
options:
  bundleIdPrefix: com.zwthys
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
targets:
  TeslaMateMobile:
    type: application
    platform: iOS
    sources:
      - TeslaMateMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zwthys.teslamate
        PRODUCT_NAME: TeslaMateMobile
        PRODUCT_MODULE_NAME: TeslaMateMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TeslaMateMobile/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: MapLibre
    scheme:
      testTargets:
        - TeslaMateMobileTests
        - TeslaMateMobileUITests
  TeslaMateMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TeslaMateMobileTests
    dependencies:
      - target: TeslaMateMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TeslaMateMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TeslaMateMobileUITests
    dependencies:
      - target: TeslaMateMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TeslaMateMobile
