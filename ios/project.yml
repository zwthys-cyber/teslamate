name: TeslaMateMobile
options:
  bundleIdPrefix: com.zwthys
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  TeslaMateMobile:
    type: application
    platform: iOS
    sources:
      - TeslaMateMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zwthys.teslamate
        PRODUCT_NAME: TeslaMate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TeslaMate
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
